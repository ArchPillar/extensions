name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per ref: a new push (or force-push) cancels the run still queued or running for
# the same branch, so rapid re-pushes supersede instead of piling up stale, doomed-to-be-cancelled runs.
# main is excluded from cancellation (github.run_id makes its group unique) so no push to main is skipped.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  skills-manifest:
    name: Skills manifest check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SKILLS_REPO: ArchPillar/claude-skills
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The builder is canonical in the marketplace repo; fetch it (public, shallow clone) and check
      # this repo's manifest against it. Fails if a published skill is missing from the manifest
      # (would silently never ship) or the manifest lists a skill that does not exist.
      - name: Fetch the canonical builder
        run: git clone --depth 1 "https://github.com/${SKILLS_REPO}.git" target
      - name: Check skill marketplace manifest
        run: python3 target/build_marketplace.py --check --source-root "$GITHUB_WORKSPACE"

  build-and-test:
    runs-on: ubuntu-latest
    # Cap the job so a hanging test can never burn the runner for hours.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      # -bl records every task, project instance and file write. Localization.Tooling has
      # intermittently failed here under parallel builds -- CreateAppHost losing obj/.../apphost,
      # GenerateDepsFile hitting a locked bin/.../deps.json -- and the console log does not say
      # which second writer touched those files. The binlog is uploaded on failure so the next
      # occurrence is diagnosable instead of costing another investigation round.
      - name: Build
        run: dotnet build -c Release --no-restore -bl:build.binlog

      - name: Upload the build binlog
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-binlog-${{ github.run_id }}-${{ github.run_attempt }}
          path: build.binlog
          retention-days: 14
          if-no-files-found: warn

      - name: Test
        # --blame-hang-timeout names and dumps a test that wedges, instead of hanging until the job cap.
        run: dotnet test -c Release --no-build --verbosity normal --blame-hang-timeout 5m

  trim-aot-publish:
    name: Trim & NativeAOT publish
    runs-on: ubuntu-latest
    # NativeAOT native compilation is slower than a normal build, so this job gets its own cap.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # The samples self-validate: they print OK/BROKEN and return exit 0 only when every embed/file/satellite
      # translation resolved, so a non-zero exit (a trimmer or AOT regression in the library) fails the job.
      - name: Publish and run the trim + single-file sample
        run: |
          dotnet publish samples/Localization/Localization.TrimSample/Localization.TrimSample.csproj \
            -c Release -r linux-x64 --self-contained true -o artifacts/trim
          ./artifacts/trim/TrimSample

      - name: Publish and run the NativeAOT sample
        run: |
          dotnet publish samples/Localization/Localization.AotSample/Localization.AotSample.csproj \
            -c Release -r linux-x64 -o artifacts/aot
          ./artifacts/aot/AotSample

  wasm-publish:
    name: Blazor WASM hosted publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # A server that hosts a Blazor WebAssembly client that references a localized library, in the MODERN layout
      # (composition via the static web asset pipeline, no Microsoft.AspNetCore.Components.WebAssembly.Server — the
      # classic package wholesale-copies the client and would mask the propagation gap). Build then publish
      # --no-build (the deploy shape: build once, publish/containerize without rebuilding). Three assertions
      # follow: the composed wwwroot (manifest + merged bundle present, no _content leak, no host-root file copy),
      # the host's static web asset metadata (the authority's assets must be AssetMode=All, which is the whole
      # bug — CurrentProject does not cross the ProjectReference on SDK 9), and end-to-end (the running host serves
      # the manifest and every file it lists). The metadata + runtime checks are the SDK-independent guards; the
      # file tree alone passes on SDK 10, which forwards CurrentProject and so masks the gap.
      - name: Build the hosted WASM sample
        run: |
          dotnet build samples/Localization/Localization.WasmHostSample/Localization.WasmHostSample.csproj \
            -c Release

      - name: Publish the hosted WASM sample (no build)
        run: |
          dotnet publish samples/Localization/Localization.WasmHostSample/Localization.WasmHostSample.csproj \
            -c Release --no-build -o artifacts/wasmhost

      # All assertions live in a .NET file-based app (eng/, like the other tooling scripts) rather than inline
      # shell: it parses the static-web-asset and catalog JSON natively, runs the published host and checks it
      # over HTTP, and is runnable the same way locally. It checks the file tree (manifest + merged bundle
      # present, no _content leak, no host-root file copy), that the bundle carries the library's strings, the
      # host's staticwebassets.publish.json (authority asset is AssetMode=All — the SDK-independent guard), and
      # end-to-end (the running host serves the manifest and every file it lists). Exits non-zero on any failure.
      - name: Assert the published output
        run: |
          dotnet run eng/assert-wasm-publish.cs -- \
            artifacts/wasmhost \
            samples/Localization/Localization.WasmHostSample/obj
